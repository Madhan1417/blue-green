<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Bites | Artisan Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Lato', sans-serif; background: #fff5f7; color: #4a4a4a; }
        nav { padding: 20px; text-align: center; background: white; border-bottom: 2px solid #ffe0e6; }
        .hero { padding: 80px 20px; text-align: center; background: #ffe0e6; }
        h1 { font-family: 'Playfair Display', serif; color: #d63384; font-size: 3rem; margin: 0; }
        .menu-section { max-width: 900px; margin: 40px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .cake-item { background: white; border-radius: 15px; overflow: hidden; text-align: center; padding-bottom: 20px; border: 1px solid #ffd1dc; }
        .cake-img { width: 100%; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center; font-style: italic; color: #999; }
        .price { color: #d63384; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>
    <nav><strong>SWEET BITES BAKERY</strong></nav>
    <div class="hero">
        <h1>Baked with Love!!!</h1>
        <p>Every slice tells  story of sweetness and joy.</p>
	<p> Hello Hii I'Am Madhann.</p> 
    </div>
    <div class="menu-section">
        <div class="cake-item">
            <div class="cake-img">Red Velvet</div>
            <h3>Classic Red Velvet</h3>
            <p class="price">$25.00</p>
        </div>
        <div class="cake-item">
            <div class="cake-img">Chocolate Luxe</div>
            <h3>Dark Chocolate</h3>
            <p class="price">$30.00</p>
        </div>
        <div class="cake-item">
            <div class="cake-img">Vanilla Bean</div>
            <h3>Creamy Vanilla</h3>
            <p class="price">$22.00</p>
        </div>
    </div>
</body>
</html>
