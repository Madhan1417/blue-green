name: Blue-Green Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/blue-green-Deployment

          # Pull latest code
          git pull origin main

          # Detect current active port
          CURRENT=$(grep proxy_pass /etc/nginx/sites-available/default)

          if echo "$CURRENT" | grep -q "8081"; then
              NEW_ENV="green"
              NEW_PORT=8082
              OLD_CONTAINER="blue-container"
              NEW_CONTAINER="green-container"
              IMAGE="green-app"
              FOLDER="green"
          else
              NEW_ENV="blue"
              NEW_PORT=8081
              OLD_CONTAINER="green-container"
              NEW_CONTAINER="blue-container"
              IMAGE="blue-app"
              FOLDER="blue"
          fi

          echo "Deploying to $NEW_ENV environment..."

          # Build new image
          cd $FOLDER
          docker build -t $IMAGE .

          # Run new container
          docker run -d -p $NEW_PORT:80 --name $NEW_CONTAINER $IMAGE

          sleep 5

          # Update Nginx to new environment
          sudo sed -i "s|proxy_pass .*|proxy_pass http://localhost:$NEW_PORT;|" /etc/nginx/sites-available/default

          sudo systemctl reload nginx

          echo "Switched traffic to $NEW_ENV"

          # Remove old container
          docker rm -f $OLD_CONTAINER || true
