name: Blue-Green Deployment (Manual Traffic Control)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/blue-green
            git pull origin main

            # Detect which env is currently active (from nginx)
            CURRENT=$(grep "proxy_pass" /etc/nginx/sites-available/default)

            if echo "$CURRENT" | grep -q "8081"; then
                TARGET_ENV="green"
                PORT=8082
                CONTAINER="green-container"
                IMAGE="green-app"
                FOLDER="green"
            else
                TARGET_ENV="blue"
                PORT=8081
                CONTAINER="blue-container"
                IMAGE="blue-app"
                FOLDER="blue"
            fi

            echo "Updating $TARGET_ENV environment on port $PORT..."

            cd "$FOLDER"

            # Remove ONLY target env container (not both)
            docker rm -f "$CONTAINER" || true
            docker rmi "$IMAGE" || true

            # Build new image
            docker build -t "$IMAGE" .

            # Run container on fixed port
            docker run -d -p "$PORT":80 --name "$CONTAINER" "$IMAGE"

            echo "$TARGET_ENV updated successfully. Nginx not changed."
