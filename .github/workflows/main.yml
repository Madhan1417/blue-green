name: Blue-Green Deployment (Auto Sync + Clean Rebuild)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/blue-green

            echo "🔄 Syncing latest code from GitHub..."
            git fetch origin
            git reset --hard origin/main

            echo "📌 Latest commit:"
            git log -1

            # 🔥 IMPORTANT FIX: Sync root code into both environments
            echo "📁 Updating blue & green folders..."

            cp -r index.html blue/index.html
            cp -r index.html green/index.html

            # (If you have multiple files, use this instead)
            # cp -r * blue/
            # cp -r * green/

            # 🔍 Detect active environment from nginx
            CURRENT=$(grep "proxy_pass" /etc/nginx/sites-enabled/default)

            if echo "$CURRENT" | grep -q "8081"; then
                TARGET_ENV="green"
                PORT=8082
                CONTAINER="green-container"
                IMAGE="green-app"
                FOLDER="green"
            else
                TARGET_ENV="blue"
                PORT=8081
                CONTAINER="blue-container"
                IMAGE="blue-app"
                FOLDER="blue"
            fi

            echo "🚀 Deploying to $TARGET_ENV on port $PORT..."

            cd "$FOLDER"

            # 🧹 Remove old container & image
            docker rm -f "$CONTAINER" 2>/dev/null || echo "No old container"
            docker rmi "$IMAGE" 2>/dev/null || echo "No old image"

            # 🏗️ Build fresh image (NO CACHE)
            docker build --no-cache -t "$IMAGE" .

            # ▶️ Run container
            docker run -d -p "$PORT":80 --name "$CONTAINER" "$IMAGE"

            echo "🔁 Ensuring both environments are running..."

            # Ensure blue is running
            docker ps --format '{{.Names}}' | grep -q "^blue-container$" || \
              docker run -d -p 8081:80 --name blue-container blue-app || true

            # Ensure green is running
            docker ps --format '{{.Names}}' | grep -q "^green-container$" || \
              docker run -d -p 8082:80 --name green-container green-app || true

            echo "✅ Deployment completed successfully"
