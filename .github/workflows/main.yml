name: Blue-Green Deployment (Manual Traffic Control)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/blue-green
            git pull origin main

            # Detect active env from nginx
            CURRENT=$(grep "proxy_pass" /etc/nginx/sites-available/default)

            if echo "$CURRENT" | grep -q "8081"; then
                TARGET_ENV="green"
                PORT=8082
                CONTAINER="green-container"
                IMAGE="green-app"
                FOLDER="green"
            else
                TARGET_ENV="blue"
                PORT=8081
                CONTAINER="blue-container"
                IMAGE="blue-app"
                FOLDER="blue"
            fi

            echo "Updating $TARGET_ENV on port $PORT..."

            # ----------- UPDATE TARGET ENV -----------
            cd "$FOLDER"

            docker rm -f "$CONTAINER" || true
            docker rmi "$IMAGE" || true

            docker build -t "$IMAGE" .
            docker run -d -p "$PORT":80 --name "$CONTAINER" "$IMAGE"

            # ----------- ENSURE BOTH CONTAINERS RUNNING -----------
            echo "Checking both environments..."

            # Check and restart blue if missing
            if ! docker ps --format '{{.Names}}' | grep -q "^blue-container$"; then
                docker run -d -p 8081:80 --name blue-container blue-app || echo "Blue image not found, skipping..."
            fi

            # Check and restart green if missing
            if ! docker ps --format '{{.Names}}' | grep -q "^green-container$"; then
                docker run -d -p 8082:80 --name green-container green-app || echo "Green image not found, skipping..."
            fi

            echo "Both environments are now running"
