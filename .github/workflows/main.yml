name: Blue-Green Deployment (Full Automation)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Starting Deployment..."

            cd /home/ubuntu/blue-green

            # 🔐 Fix permission issue (safe for repeated runs)
            git config --global --add safe.directory /home/ubuntu/blue-green

            echo "🔄 Syncing latest code from GitHub..."
            git fetch --all
            git reset --hard origin/main
            git clean -fd

            echo "📌 Latest commit:"
            git log -1

            # =========================
            # 🔵 BUILD BLUE
            # =========================
            echo "🔵 Rebuilding BLUE..."

            cd /home/ubuntu/blue-green/blue

            docker rm -f blue-container 2>/dev/null || echo "No old blue container"
            docker rmi blue-app 2>/dev/null || echo "No old blue image"

            docker build --no-cache -t blue-app .
            docker run -d -p 8081:80 --name blue-container blue-app

            echo "✅ BLUE deployed"

            # =========================
            # 🟢 BUILD GREEN
            # =========================
            echo "🟢 Rebuilding GREEN..."

            cd /home/ubuntu/blue-green/green

            docker rm -f green-container 2>/dev/null || echo "No old green container"
            docker rmi green-app 2>/dev/null || echo "No old green image"

            docker build --no-cache -t green-app .
            docker run -d -p 8082:80 --name green-container green-app

            echo "✅ GREEN deployed"

            # =========================
            # 🔍 VERIFY
            # =========================
            echo "📊 Running containers:"
            docker ps

            echo "🌐 Testing endpoints:"
            curl -s http://localhost:8081 | head -n 3
            curl -s http://localhost:8082 | head -n 3

            echo "🎉 Deployment completed successfully!"